<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" fill="none">
  <defs>
    <linearGradient id="fc-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#00CCAA"/>
    </linearGradient>
  </defs>
  <!-- Speech bubble icon -->
  <rect x="4" y="6" width="32" height="28" rx="8" fill="url(#fc-grad)"/>
  <polygon points="12,34 18,42 22,34" fill="url(#fc-grad)"/>
  <!-- Wave inside bubble -->
  <path d="M12 18 Q16 14, 20 18 T28 18" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M12 24 Q16 20, 20 24 T28 24" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
  <!-- FlowChat text -->
  <text x="44" y="32" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="700" fill="#1a1a2e">
    Flow<tspan fill="url(#fc-grad)">Chat</tspan>
